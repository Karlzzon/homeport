apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: homeport
servers: 1
agents: 2
image: rancher/k3s:v1.37.2-k3s1
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6443"
ports:
  - port: 127.0.0.1:80:80
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:443:443
    nodeFilters:
      - loadbalancer

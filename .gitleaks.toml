[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private IPv4 address"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''

[[rules.allowlists]]
description = "Documented k3s and Docker default ranges"
regexTarget = "match"
regexes = ['''^10\.4[23]\.''', '''^172\.1[78]\.''']
